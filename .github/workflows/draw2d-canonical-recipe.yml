name: Draw2D product source-byte admission (private recipe pending)

on:
  push:
    branches:
      - work/draw2d-native-sparse-damage-20261121
  pull_request:
    paths:
      - '.github/workflows/draw2d-canonical-recipe.yml'
      - 'org.eclipse.draw2d/src/org/eclipse/draw2d/**'
      - 'org.eclipse.draw2d.tests/src/org/eclipse/draw2d/test/**'
  workflow_dispatch:

permissions: {}

jobs:
  source-byte-admission:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout GEF receiving product only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify all six exact source-output SHA-256 receipts
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          expected = {
            "org.eclipse.draw2d.tests/src/org/eclipse/draw2d/test/Draw2dTestSuite.java": "8405c6ec03db11fd2692b7c3659fa682a0b8d1a62e492afc4f6e2b815331789c",
            "org.eclipse.draw2d.tests/src/org/eclipse/draw2d/test/NativeDamageRegionsTest.java": "da4434767125063de4f0df8877884f7dfe24f4bb82e593d0caa02beb000893e6",
            "org.eclipse.draw2d.tests/src/org/eclipse/draw2d/test/NativeSparseDamageSwtTest.java": "a7b335b3da4649d4221e8dd4e3e04ec79c1a2cc28cc37ced16c119178296ca26",
            "org.eclipse.draw2d/src/org/eclipse/draw2d/DeferredUpdateManager.java": "680dad27c430162d673a2be5f1a7f453a41e7e4bda0396e077244701c7b421fd",
            "org.eclipse.draw2d/src/org/eclipse/draw2d/NativeGraphicsSource.java": "a1ae5e55d0a47574145a686cf4a0bec69e39497dfeca870f0932633c7d19af50",
            "org.eclipse.draw2d/src/org/eclipse/draw2d/internal/NativeDamageRegions.java": "e0cf827492db611764629a18b64eff9798a13ecc43f159700e75ed78d9be8721"
          }
          for path, wanted in expected.items():
              actual = hashlib.sha256(Path(path).read_bytes()).hexdigest()
              if actual != wanted:
                  raise SystemExit(f'SOURCE DRIFT: {path} actual={actual} expected={wanted}')
          print('All six product source SHA-256 postimage identities PASS.')
          print('Canonical OpenRewrite execution NOT_RUN: Synexia is private and')
          print('the public GEF GITHUB_TOKEN cannot read its source.')
          PY
