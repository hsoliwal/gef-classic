name: GEF Class verification build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  build:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        java: [ 25 ]
        os: [ubuntu-latest, windows-latest, macos-latest]
        target: [2024-09, master]
        include:
          - { java: 21, os: ubuntu-latest, target: 2024-09 }
          - { java: 21, os: windows-latest, target: 2024-09 }
          - { java: 21, os: macos-latest, target: 2024-09 }
    runs-on: ${{ matrix.os }} 
    name: Java ${{ matrix.java }} OS ${{ matrix.os }} Target ${{ matrix.target }} verify
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Check out the shared test-report verifier
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: hsoliwal/eclipse.platform.swt
        ref: efd0971e30f12146a300dbbed0dd2a18170c8329
        path: .release-tools/swt
        sparse-checkout: tools/release/readiness.py
        sparse-checkout-cone-mode: false
        persist-credentials: false
    - name: Keep the verifier outside the product reactor
      shell: bash
      run: |
        mv .release-tools/swt "$RUNNER_TEMP/swt-release-tools"
        rmdir .release-tools
        test "$(git -C "$RUNNER_TEMP/swt-release-tools" rev-parse HEAD)" = efd0971e30f12146a300dbbed0dd2a18170c8329
    - name: Set up test-report validation
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: '3.11'
    - name: Set up Java ${{ matrix.java }}
      uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
      with:
        distribution: 'temurin'
        java-version: ${{ matrix.java }}
        cache: 'maven'
    - name: Set up Maven
      uses: stCarolas/setup-maven@d6af6abeda15e98926a57b5aa970a96bb37f97d1 # v5
      with:
        maven-version: 3.9.12
    - name: Build with Maven
      uses: coactions/setup-xvfb@b6b4fcfb9f5a895edadc3bc76318fae0ac17c8b3 # v1.0.1
      with:
       run: >- 
        mvn -V -B -fae -ntp -P${{ matrix.target }}
        -DskipTests=false -Dmaven.test.skip=false -Dmaven.test.failure.ignore=false
        -DfailIfNoTests=true -Dtycho.baseline.replace=none clean verify
    - name: Require successful executed tests from each test bundle
      shell: bash
      run: |
        python - <<'PY'
        import importlib.util
        import json
        import os
        from pathlib import Path

        source = Path(os.environ['RUNNER_TEMP']) / 'swt-release-tools/tools/release/readiness.py'
        spec = importlib.util.spec_from_file_location('swt_readiness', source)
        verifier = importlib.util.module_from_spec(spec)
        spec.loader.exec_module(verifier)
        seen_files = set()
        for name in ('org.eclipse.draw2d.tests', 'org.eclipse.gef.tests', 'org.eclipse.zest.tests'):
            counts = verifier.junit_report(Path(name) / 'target/surefire-reports', seen_files)
            if counts['failures'] or counts['errors']:
                raise SystemExit('Failed tests: ' + name)
            print(json.dumps({'bundle': name, **counts}))
        PY
    - name: Record the verified source and toolchain
      if: always()
      shell: bash
      run: |
        {
          git rev-parse HEAD
          git rev-parse 'HEAD^{tree}'
          java -version 2>&1
          mvn -version
          git -C "$RUNNER_TEMP/swt-release-tools" rev-parse HEAD
          python -c 'import hashlib, os; from pathlib import Path; p = Path(os.environ["RUNNER_TEMP"]) / "swt-release-tools/tools/release/readiness.py"; print("REPORT_PARSER_SHA256=" + hashlib.sha256(p.read_bytes()).hexdigest())'
        } > "$RUNNER_TEMP/gef-source.txt"
    - name: Upload Source and Toolchain
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: source-java-${{ matrix.java }}-${{ matrix.os }}-target-${{ matrix.target }}-attempt-${{ github.run_attempt }}
        if-no-files-found: error
        path: ${{ runner.temp }}/gef-source.txt
    - name: Upload Test Results for Java-${{ matrix.java }}
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: test-results-java-${{ matrix.java }}-${{ matrix.os }}-target-${{ matrix.target }}-attempt-${{ github.run_attempt }}
        if-no-files-found: error
        path: |
          ${{ github.workspace }}/**/target/surefire-reports/*.xml

  native-sparse-redraw:
    name: Native SWT sparse redraw — Java21 ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            jvm_args: '-Xmx512m -Ddraw2d.native.sparseDamage=true'
          - os: windows-latest
            jvm_args: '-Xmx512m -Ddraw2d.native.sparseDamage=true'
          - os: macos-latest
            jvm_args: '-Xmx512m -XstartOnFirstThread -Ddraw2d.native.sparseDamage=true'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Java 21
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Set up Maven
        uses: stCarolas/setup-maven@d6af6abeda15e98926a57b5aa970a96bb37f97d1 # v5
        with:
          maven-version: 3.9.12
      - name: Execute real native SWT Canvas test on GTK/Xvfb
        if: runner.os == 'Linux'
        env:
          DRAW2D_SPARSE_NATIVE_REQUIRED: 'true'
        uses: coactions/setup-xvfb@b6b4fcfb9f5a895edadc3bc76318fae0ac17c8b3 # v1.0.1
        with:
          run: >-
            mvn -V -B -fae -ntp -P2024-09
            -Dtest.vmargs="${{ matrix.jvm_args }}"
            -DskipTests=false -Dmaven.test.skip=false -Dmaven.test.failure.ignore=false
            -DfailIfNoTests=true -Dtycho.baseline.replace=none clean verify
      - name: Execute real native SWT Canvas test on Windows/Cocoa
        if: runner.os != 'Linux'
        shell: bash
        env:
          DRAW2D_SPARSE_NATIVE_REQUIRED: 'true'
        run: >-
          mvn -V -B -fae -ntp -P2024-09
          -Dtest.vmargs="${{ matrix.jvm_args }}"
          -DskipTests=false -Dmaven.test.skip=false -Dmaven.test.failure.ignore=false
          -DfailIfNoTests=true -Dtycho.baseline.replace=none clean verify
      - name: Require exact executed SWT native test identities and no failures
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          reports = Path('org.eclipse.draw2d.tests/target/surefire-reports')
          paths = sorted(reports.glob('TEST-*.xml'))
          if not paths:
              raise SystemExit('No actual JUnit reports')
          identities = {}
          for path in paths:
              root = ET.parse(path).getroot()
              for case in root.iter('testcase'):
                  cls = case.attrib.get('classname', '')
                  if cls in ('org.eclipse.draw2d.test.NativeSparseDamageSwtTest',
                             'org.eclipse.draw2d.test.NativeDamageRegionsTest'):
                      key = (cls, case.attrib.get('name', ''))
                      identities[key] = identities.get(key, 0) + 1
                      if any(case.find(tag) is not None
                             for tag in ('error', 'failure', 'skipped')):
                          raise SystemExit(f'Native damage test not passed: {key}')
          native = [(key, count) for key, count in identities.items()
                    if key[0] == 'org.eclipse.draw2d.test.NativeSparseDamageSwtTest']
          geometry = [(key, count) for key, count in identities.items()
                      if key[0] == 'org.eclipse.draw2d.test.NativeDamageRegionsTest']
          if len(native) != 1 or native[0][1] != 1:
              raise SystemExit('Required native SWT Canvas test not exactly once: ' + str(native))
          if len(geometry) != 5 or any(count != 1 for _, count in geometry):
              raise SystemExit('Required geometry regression methods not exactly once: ' + str(geometry))
          print('Passed native SWT Canvas and five geometry methods from actual Tycho XML')
          PY
      - name: Preserve raw source-bound test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sparse-native-java21-${{ matrix.os }}-raw-reports
          if-no-files-found: warn
          path: org.eclipse.draw2d.tests/target/surefire-reports/*.xml
