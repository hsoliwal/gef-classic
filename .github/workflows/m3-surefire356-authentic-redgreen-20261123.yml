# SPDX-License-Identifier: Apache-2.0
name: Original Apache Surefire 3.5.6 reporter real JUnit RED GREEN

on:
  push:
    branches: [proof/surefire356-junit-redgreen-20261123]
  pull_request:
    paths:
      - 'tests/m3/surefire356-authentic/**'
      - '.github/workflows/m3-surefire356-authentic-redgreen-20261123.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-surefire-356-red-green:
    if: github.repository == 'hsoliwal/gef-classic'
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - name: Checkout review-only GEF proof fixtures
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up OpenJDK 21
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Set up Maven 3.9.12
        uses: stCarolas/setup-maven@d6af6abeda15e98926a57b5aa970a96bb37f97d1 # v5
        with:
          maven-version: 3.9.12
      - name: Checkout exact authentic upstream Apache Surefire 3.5.6 release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: apache/maven-surefire
          ref: 25ea054860a5c1e5932b360d8aa0a31944c2b841
          path: '.m3-surefire356/upstream'
          persist-credentials: false
      - name: Admit upstream exact preimages and apply only new JUnit3 test
        shell: bash
        run: |
          set -euo pipefail
          original=.m3-surefire356/upstream
          test "$(git -C "$original" rev-parse HEAD)" = 25ea054860a5c1e5932b360d8aa0a31944c2b841
          test -z "$(git -C "$original" status --porcelain)"
          (
            cd "$original"
            printf '%s  %s\n' \
              42b24e48035ed5e5e6dea2d960b38ef6a92faee6c1caf8234fdc74cc79fa57f8 'maven-surefire-common/src/main/java/org/apache/maven/plugin/surefire/report/StatelessXmlReporter.java' \
              83b5c60d098b7f5c29a607e7049742dac4930b6a9c640e38f32d844b66cc6088 'maven-surefire-common/src/test/java/org/apache/maven/plugin/surefire/report/StatelessXmlReporterTest.java' \
              | sha256sum --check --status
          )
          git -C "$original" apply --check "$GITHUB_WORKSPACE/tests/m3/surefire356-authentic/StatelessXmlReporterTest.patch"
          git -C "$original" apply "$GITHUB_WORKSPACE/tests/m3/surefire356-authentic/StatelessXmlReporterTest.patch"
          (
            cd "$original"
            printf '%s  %s\n' \
              df96bf5d72924e0a472f5ea96b404469b90fd66f6f12e51c11edd4236a73a053 'maven-surefire-common/src/test/java/org/apache/maven/plugin/surefire/report/StatelessXmlReporterTest.java' \
              | sha256sum --check --status
          )
          test "$(git -C "$original" diff --name-only)" = 'maven-surefire-common/src/test/java/org/apache/maven/plugin/surefire/report/StatelessXmlReporterTest.java'
          git -C "$original" diff --check
          echo 'EXACT_ORIGINAL_SUREFIRE_356_AND_SOURCE_SEALED_JUNIT_PASS'
      - name: Execute actual original unmodified reporter and require expected RED JUnit
        shell: bash
        run: |
          set -euo pipefail
          original=.m3-surefire356/upstream
          proof="$RUNNER_TEMP/surefire356-authentic"
          mkdir -p "$proof"
          set +e
          mvn -B -ntp -f "$original/pom.xml" -pl maven-surefire-common -am \
            '-Dtest=StatelessXmlReporterTest#testCountsRepeatedMethodNameInvocationsInXml' \
            -Dsurefire.failIfNoSpecifiedTests=false package \
            > "$proof/baseline-red-maven.log" 2>&1
          rc=$?
          set -e
          echo "$rc" > "$proof/baseline-maven-exit-code.txt"
          if test "$rc" -eq 0; then
            tail -n 80 "$proof/baseline-red-maven.log"
            echo 'REFUSED: original reporter unexpectedly green'
            exit 1
          fi
          cp -- "$original/maven-surefire-common/target/surefire-reports/TEST-org.apache.maven.plugin.surefire.report.StatelessXmlReporterTest.xml" \
            "$proof/baseline-red.xml"
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          p = Path(__import__('os').environ['RUNNER_TEMP'])/'surefire356-authentic/baseline-red.xml'
          root = ET.parse(p).getroot()
          cases = list(root.iter('testcase'))
          assert len(cases) == 1 and cases[0].get('name') == 'testCountsRepeatedMethodNameInvocationsInXml', 'wrong/no executed test'
          failure = cases[0].find('failure')
          assert failure is not None, 'expected original reporter JUnit failure'
          diagnostic = (failure.get('message') or '') + ' ' + (failure.text or '')
          assert all(part in diagnostic for part in ('expected', '2', '1')), diagnostic[:500]
          assert (root.get('tests'), root.get('failures')) == ('1', '1'), root.attrib
          assert cases[0].find('skipped') is None and cases[0].find('error') is None
          print('ORIGINAL_REPORTER_JUNIT_RED_CONFIRMED: genuine Surefire 3.5.6 executed case')
          PY
      - name: Receive exact corrected reporter and require real candidate GREEN JUnit
        shell: bash
        run: |
          set -euo pipefail
          original=.m3-surefire356/upstream
          proof="$RUNNER_TEMP/surefire356-authentic"
          git -C "$original" apply --check "$GITHUB_WORKSPACE/tests/m3/surefire356-authentic/StatelessXmlReporter.patch"
          git -C "$original" apply "$GITHUB_WORKSPACE/tests/m3/surefire356-authentic/StatelessXmlReporter.patch"
          (
            cd "$original"
            printf '%s  %s\n' \
              06235aefe3e27f0c4b5a1d8e1ebff471c4f445d48bb54e487b6c0fd6d004fdfd 'maven-surefire-common/src/main/java/org/apache/maven/plugin/surefire/report/StatelessXmlReporter.java' \
              df96bf5d72924e0a472f5ea96b404469b90fd66f6f12e51c11edd4236a73a053 'maven-surefire-common/src/test/java/org/apache/maven/plugin/surefire/report/StatelessXmlReporterTest.java' \
              | sha256sum --check --status
          )
          paths="$(git -C "$original" diff --name-only)"
          expected="$(printf '%s\n%s' 'maven-surefire-common/src/main/java/org/apache/maven/plugin/surefire/report/StatelessXmlReporter.java' 'maven-surefire-common/src/test/java/org/apache/maven/plugin/surefire/report/StatelessXmlReporterTest.java')"
          test "$paths" = "$expected" || { printf 'Refused source path drift: %s\n' "$paths"; exit 1; }
          git -C "$original" diff --check
          if ! mvn -B -ntp -f "$original/pom.xml" -pl maven-surefire-common -am \
            '-Dtest=StatelessXmlReporterTest#testCountsRepeatedMethodNameInvocationsInXml' \
            -Dsurefire.failIfNoSpecifiedTests=false package \
            > "$proof/candidate-green-maven.log" 2>&1; then
            tail -n 100 "$proof/candidate-green-maven.log"
            echo 'REFUSED: corrected reporter JUnit failed'
            exit 1
          fi
          cp -- "$original/maven-surefire-common/target/surefire-reports/TEST-org.apache.maven.plugin.surefire.report.StatelessXmlReporterTest.xml" \
            "$proof/candidate-green.xml"
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          p = Path(__import__('os').environ['RUNNER_TEMP'])/'surefire356-authentic/candidate-green.xml'
          root=ET.parse(p).getroot()
          cases=list(root.iter('testcase'))
          assert len(cases)==1 and cases[0].get('name')=='testCountsRepeatedMethodNameInvocationsInXml'
          assert (root.get('tests'),root.get('errors'),root.get('failures'),root.get('skipped'))==('1','0','0','0'),root.attrib
          assert all(cases[0].find(k) is None for k in ('failure','error','skipped'))
          print('CORRECTED_REPORTER_JUNIT_GREEN_CONFIRMED: original Apache Surefire 3.5.6 test reactor')
          PY
          (
            cd "$original"
            sha256sum 'maven-surefire-common/src/main/java/org/apache/maven/plugin/surefire/report/StatelessXmlReporter.java' 'maven-surefire-common/src/test/java/org/apache/maven/plugin/surefire/report/StatelessXmlReporterTest.java'
            git rev-parse HEAD
            git diff --stat
          ) > "$proof/source-and-toolchain.txt"
          java -version 2>> "$proof/source-and-toolchain.txt"
          mvn -version >> "$proof/source-and-toolchain.txt"
          echo 'SUREFIRE_356_AUTHENTIC_RED_GREEN_PASS; GEF_NATIVE_RELEASE_REMAINS_HOLD'
      - name: Retain executed red/green JUnit XML, original logs and identity proof
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: surefire356-authentic-apache-original-reporter-junit
          if-no-files-found: warn
          path: ${{ runner.temp }}/surefire356-authentic/**

  gef-tycho-gtk-report-handoff:
    name: Java 21 GTK original Tycho report producer differential
    needs: original-surefire-356-red-green
    if: github.repository == 'hsoliwal/gef-classic' && github.event_name != 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CI: 'true'
      DRAW2D_SPARSE_NATIVE_REQUIRED: 'true'
      GEF_PROOF_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PROOF_ROOT: ${{ runner.temp }}/surefire356-tycho-handoff
      STOCK_M2: ${{ runner.temp }}/surefire356-stock-m2
      CANDIDATE_M2: ${{ runner.temp }}/surefire356-candidate-m2
    steps:
      - name: Check out GEF once at the exact proof head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.GEF_PROOF_SHA }}
          path: gef
          fetch-depth: 0
          persist-credentials: false
      - name: Check out original Apache Surefire 3.5.6
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: apache/maven-surefire
          ref: 25ea054860a5c1e5932b360d8aa0a31944c2b841
          path: upstream-surefire
          persist-credentials: false
      - name: Check out original Tycho 5.0.4
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: eclipse-tycho/tycho
          ref: c4349ee27dfde2817dfc7121b5f84bfb9eeb0195
          path: upstream-tycho
          persist-credentials: false
      - name: Check out the unchanged GEF report verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: hsoliwal/eclipse.platform.swt
          ref: 1202ab304c3b81b73b628d201b987941d16c94d2
          path: original-verifier
          sparse-checkout: tools/release/readiness.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Set up Java 21 without caching candidate artifacts
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Maven 3.9.12
        uses: stCarolas/setup-maven@d6af6abeda15e98926a57b5aa970a96bb37f97d1 # v5
        with:
          maven-version: 3.9.12
      - name: Freeze source identities and create independent Maven repositories
        shell: bash
        run: |
          set -euo pipefail
          test ! -e "$STOCK_M2"
          test ! -e "$CANDIDATE_M2"
          mkdir -p "$STOCK_M2" "$PROOF_ROOT/baseline" "$PROOF_ROOT/candidate" "$PROOF_ROOT/producer"
          test "$(git -C gef rev-parse HEAD)" = "$GEF_PROOF_SHA"
          test -z "$(git -C gef status --porcelain=v1 --untracked-files=all)"
          test "$(git -C upstream-surefire rev-parse HEAD)" = 25ea054860a5c1e5932b360d8aa0a31944c2b841
          test "$(git -C upstream-tycho rev-parse HEAD)" = c4349ee27dfde2817dfc7121b5f84bfb9eeb0195
          test "$(git -C original-verifier rev-parse HEAD)" = 1202ab304c3b81b73b628d201b987941d16c94d2
          for tree in upstream-surefire upstream-tycho original-verifier; do
            test -z "$(git -C "$tree" status --porcelain=v1 --untracked-files=all)"
          done
          printf '%s  %s\n' 4fb52bdc9415c290a7ad06c74d46e8e342bff954c7d6c8e03d12d24562f896ca \
            original-verifier/tools/release/readiness.py | sha256sum --check --status
          test "$(git hash-object gef/tests/m3/surefire356-authentic/StatelessXmlReporter.patch)" = 96ba1e191f602e44cd8281f6baa74c909615b2cd
          test "$(git hash-object gef/tests/m3/surefire356-authentic/StatelessXmlReporterTest.patch)" = 5b23ef250a33a4d346d0f4e4cf8e42bb7f92a814
          {
            for tree in gef upstream-surefire upstream-tycho original-verifier; do
              printf '%s ' "$tree"
              git -C "$tree" rev-parse HEAD 'HEAD^{tree}'
            done
            sha256sum original-verifier/tools/release/readiness.py
            java -version 2>&1
            mvn -version
          } > "$PROOF_ROOT/source-and-toolchain.txt"
          cat > "$PROOF_ROOT/capture-origins.py" <<'PY'
          import hashlib, json, os, sys, zipfile
          from pathlib import Path
          from urllib.parse import unquote, urlsplit
          lane, repository = sys.argv[1:]
          proof = Path(os.environ['PROOF_ROOT'])
          booter = Path(repository, 'org/eclipse/tycho/org.eclipse.tycho.surefire.osgibooter/5.0.4/org.eclipse.tycho.surefire.osgibooter-5.0.4.jar')
          cls = 'org/apache/maven/plugin/surefire/report/StatelessXmlReporter.class'
          expected_jar = hashlib.sha256(booter.read_bytes()).hexdigest()
          with zipfile.ZipFile(booter) as archive:
              expected_class = hashlib.sha256(archive.read(cls)).hexdigest()
          bundles = {'org.eclipse.draw2d.tests', 'org.eclipse.gef.tests', 'org.eclipse.zest.tests'}
          reporter = 'org.apache.maven.plugin.surefire.report.StatelessXmlReporter source: '
          origins, covered = [], set()
          for log in sorted((proof / lane).glob('classload-*.log')):
              data = log.read_bytes()
              text = data.decode('utf-8')
              relevant = {b for b in bundles if '/' + b + '/' in text}
              if not relevant:
                  continue
              loads = [line.split(reporter, 1)[1].strip() for line in text.splitlines() if reporter in line]
              assert loads, 'Missing actual reporter class load: ' + str(log)
              for location in loads:
                  url = urlsplit(location)
                  assert url.scheme == 'file' and not url.netloc, 'Unqualified class origin: ' + location
                  jar = Path(unquote(url.path))
                  assert jar.is_file() and 'org.eclipse.tycho.surefire.osgibooter' in jar.name, location
                  assert hashlib.sha256(jar.read_bytes()).hexdigest() == expected_jar, 'Wrong runtime booter'
                  with zipfile.ZipFile(jar) as archive:
                      digest = hashlib.sha256(archive.read(cls)).hexdigest()
                  assert digest == expected_class, 'Wrong runtime reporter'
                  origins.append({'lane': lane, 'log': log.name, 'log_sha256': hashlib.sha256(data).hexdigest(),
                                  'source': location, 'booter_sha256': expected_jar, 'reporter_sha256': digest,
                                  'bundles': sorted(relevant)})
              covered.update(relevant)
          assert covered == bundles, 'Missing forked reporter-origin proof: ' + lane
          (proof / lane / 'origins.json').write_text(json.dumps(origins, indent=2) + '\n')
          print(json.dumps(origins, indent=2))
          PY
      - name: Run the original complete GEF reactor with stock Tycho under GTK
        uses: coactions/setup-xvfb@b6b4fcfb9f5a895edadc3bc76318fae0ac17c8b3 # v1.0.1
        env:
          JAVA_TOOL_OPTIONS: -Ddraw2d.native.sparseDamage=true -Xlog:class+load=info:file=${{ env.PROOF_ROOT }}/baseline/classload-%p.log
        with:
          working-directory: gef
          run: >-
            mvn -V -B -fae -ntp -P2024-09
            -Dmaven.repo.local=${{ env.STOCK_M2 }}
            -l ${{ env.PROOF_ROOT }}/baseline/maven.log
            -DskipTests=false -Dmaven.test.skip=false -Dmaven.test.failure.ignore=false
            -DfailIfNoTests=true -Dtycho.baseline.replace=none clean verify
      - name: Require the original reporter counter rejection and preserve the stock repository
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, importlib.util, json, os, shutil
          from pathlib import Path
          import xml.etree.ElementTree as ET
          source = Path('original-verifier/tools/release/readiness.py')
          spec = importlib.util.spec_from_file_location('original_readiness', source)
          verifier = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(verifier)
          rejected, records = [], []
          for bundle in ('org.eclipse.draw2d.tests', 'org.eclipse.gef.tests', 'org.eclipse.zest.tests'):
              directory = Path('gef') / bundle / 'target/surefire-reports'
              reports = sorted(directory.rglob('TEST-*.xml'))
              shutil.copytree(directory, Path(os.environ['PROOF_ROOT'], 'baseline/reports', bundle), symlinks=True)
              assert reports, 'Missing original reports: ' + bundle
              for report in reports:
                  data = report.read_bytes()
                  root = ET.fromstring(data)
                  cases = list(root.iter('testcase'))
                  assert cases and all(c.find('failure') is None and c.find('error') is None for c in cases), report
                  try:
                      verifier.junit_report(report)
                  except ValueError as error:
                      assert report.name == 'TEST-org.eclipse.draw2d.test.Draw2dTestSuite.xml', str(error)
                      assert str(error).startswith('JUnit tests counter mismatch:'), str(error)
                      assert 0 < int(root.get('tests')) < len(cases), root.attrib
                      rejected.append(str(error))
                  records.append({'bundle': bundle, 'file': report.relative_to(directory).as_posix(), 'sha256': hashlib.sha256(data).hexdigest(),
                                  'declared': root.attrib, 'actual_cases': len(cases)})
          assert len(rejected) == 1, 'Expected one original Draw2D tests-counter rejection'
          Path(os.environ['PROOF_ROOT'], 'baseline/reports.json').write_text(json.dumps({'reports': records, 'expected_rejection': rejected}, indent=2) + '\n')
          print('ORIGINAL_GEF_COUNTER_REJECTION_CONFIRMED; original Maven reactor completed successfully')
          PY
          python3 "$PROOF_ROOT/capture-origins.py" baseline "$STOCK_M2"
          test "$(git -C gef rev-parse HEAD)" = "$GEF_PROOF_SHA"
          test -z "$(git -C gef status --porcelain=v1 --untracked-files=all)"
          mkdir "$CANDIDATE_M2"
          cp -a "$STOCK_M2/." "$CANDIDATE_M2/"
      - name: Build the source-qualified common JAR with the complete original reporter test class
        shell: bash
        working-directory: upstream-surefire
        run: |
          set -euo pipefail
          printf '%s  %s\n' \
            42b24e48035ed5e5e6dea2d960b38ef6a92faee6c1caf8234fdc74cc79fa57f8 maven-surefire-common/src/main/java/org/apache/maven/plugin/surefire/report/StatelessXmlReporter.java \
            83b5c60d098b7f5c29a607e7049742dac4930b6a9c640e38f32d844b66cc6088 maven-surefire-common/src/test/java/org/apache/maven/plugin/surefire/report/StatelessXmlReporterTest.java \
            | sha256sum --check --status
          for patch in StatelessXmlReporterTest.patch StatelessXmlReporter.patch; do
            git apply --check "$GITHUB_WORKSPACE/gef/tests/m3/surefire356-authentic/$patch"
            git apply "$GITHUB_WORKSPACE/gef/tests/m3/surefire356-authentic/$patch"
          done
          mvn -B -ntp -Dmaven.repo.local="$CANDIDATE_M2" -pl maven-surefire-common -am \
            '-Dtest=StatelessXmlReporterTest' -Dsurefire.failIfNoSpecifiedTests=false package \
            > "$PROOF_ROOT/producer/surefire-package.log" 2>&1
          cp maven-surefire-common/target/surefire-reports/TEST-org.apache.maven.plugin.surefire.report.StatelessXmlReporterTest.xml \
            "$PROOF_ROOT/producer/complete-reporter.xml"
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse('maven-surefire-common/target/surefire-reports/TEST-org.apache.maven.plugin.surefire.report.StatelessXmlReporterTest.xml').getroot()
          cases = list(root.iter('testcase'))
          assert (root.get('tests'), root.get('errors'), root.get('failures'), root.get('skipped')) == ('12', '0', '0', '0'), root.attrib
          assert len(cases) == 12 and sum(c.get('name') == 'testCountsRepeatedMethodNameInvocationsInXml' for c in cases) == 1
          assert all(c.find(k) is None for c in cases for k in ('error', 'failure', 'skipped'))
          PY
          printf '%s  %s\n' \
            06235aefe3e27f0c4b5a1d8e1ebff471c4f445d48bb54e487b6c0fd6d004fdfd maven-surefire-common/src/main/java/org/apache/maven/plugin/surefire/report/StatelessXmlReporter.java \
            df96bf5d72924e0a472f5ea96b404469b90fd66f6f12e51c11edd4236a73a053 maven-surefire-common/src/test/java/org/apache/maven/plugin/surefire/report/StatelessXmlReporterTest.java \
            | sha256sum --check --status
          expected="$(printf '%s\n%s' maven-surefire-common/src/main/java/org/apache/maven/plugin/surefire/report/StatelessXmlReporter.java maven-surefire-common/src/test/java/org/apache/maven/plugin/surefire/report/StatelessXmlReporterTest.java)"
          test "$(git diff --name-only)" = "$expected"
          git diff --check
          mvn -B -ntp -N -Dmaven.repo.local="$CANDIDATE_M2" \
            org.apache.maven.plugins:maven-install-plugin:3.1.4:install-file \
            -Dfile="$PWD/maven-surefire-common/target/maven-surefire-common-3.5.6.jar" \
            -DpomFile="$PWD/maven-surefire-common/pom.xml" -DgeneratePom=false \
            > "$PROOF_ROOT/producer/common-install.log" 2>&1
      - name: Rebuild the unchanged original Tycho booter and verify the embedded reporter
        shell: bash
        working-directory: upstream-tycho
        run: |
          set -euo pipefail
          mvn -B -ntp -f tycho-surefire/org.eclipse.tycho.surefire.osgibooter/pom.xml \
            -Dmaven.repo.local="$CANDIDATE_M2" clean install \
            > "$PROOF_ROOT/producer/tycho-booter-build.log" 2>&1
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          python3 - <<'PY'
          import hashlib, json, os, zipfile
          from pathlib import Path
          cls = 'org/apache/maven/plugin/surefire/report/StatelessXmlReporter.class'
          common = 'org/apache/maven/surefire/maven-surefire-common/3.5.6/maven-surefire-common-3.5.6.jar'
          booter = 'org/eclipse/tycho/org.eclipse.tycho.surefire.osgibooter/5.0.4/org.eclipse.tycho.surefire.osgibooter-5.0.4.jar'
          def identity(path):
              data = path.read_bytes()
              with zipfile.ZipFile(path) as jar:
                  reporter = jar.read(cls)
              return {'path': str(path), 'jar_sha256': hashlib.sha256(data).hexdigest(),
                      'reporter_sha256': hashlib.sha256(reporter).hexdigest()}
          records = {label: {'common': identity(Path(repo, common)), 'booter': identity(Path(repo, booter))}
                     for label, repo in (('baseline', os.environ['STOCK_M2']), ('candidate', os.environ['CANDIDATE_M2']))}
          assert records['candidate']['common']['reporter_sha256'] == records['candidate']['booter']['reporter_sha256']
          assert records['baseline']['booter']['reporter_sha256'] != records['candidate']['booter']['reporter_sha256']
          built = identity(Path('tycho-surefire/org.eclipse.tycho.surefire.osgibooter/target/org.eclipse.tycho.surefire.osgibooter-5.0.4.jar'))
          assert built['jar_sha256'] == records['candidate']['booter']['jar_sha256']
          Path(os.environ['PROOF_ROOT'], 'producer/artifacts.json').write_text(json.dumps(records, indent=2) + '\n')
          print(json.dumps(records, indent=2))
          PY
      - name: Run the identical complete GEF reactor with the source-built producer under GTK
        uses: coactions/setup-xvfb@b6b4fcfb9f5a895edadc3bc76318fae0ac17c8b3 # v1.0.1
        env:
          JAVA_TOOL_OPTIONS: -Ddraw2d.native.sparseDamage=true -Xlog:class+load=info:file=${{ env.PROOF_ROOT }}/candidate/classload-%p.log
        with:
          working-directory: gef
          run: >-
            mvn -V -B -fae -ntp -P2024-09
            -Dmaven.repo.local=${{ env.CANDIDATE_M2 }}
            -l ${{ env.PROOF_ROOT }}/candidate/maven.log
            -DskipTests=false -Dmaven.test.skip=false -Dmaven.test.failure.ignore=false
            -DfailIfNoTests=true -Dtycho.baseline.replace=none clean verify
      - name: Require unchanged raw testcase multisets, strict report acceptance and actual class origins
        shell: bash
        run: |
          set -euo pipefail
          python3 "$PROOF_ROOT/capture-origins.py" candidate "$CANDIDATE_M2"
          test "$(git -C gef rev-parse HEAD)" = "$GEF_PROOF_SHA"
          printf '%s  %s\n' 4fb52bdc9415c290a7ad06c74d46e8e342bff954c7d6c8e03d12d24562f896ca \
            original-verifier/tools/release/readiness.py | sha256sum --check --status
          for tree in gef upstream-tycho original-verifier; do
            test -z "$(git -C "$tree" status --porcelain=v1 --untracked-files=all)"
          done
          python3 - <<'PY'
          from collections import Counter
          import hashlib, importlib.util, json, os, zipfile
          from pathlib import Path
          import xml.etree.ElementTree as ET
          proof = Path(os.environ['PROOF_ROOT'])
          spec = importlib.util.spec_from_file_location('original_readiness', Path('original-verifier/tools/release/readiness.py'))
          verifier = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(verifier)
          before = json.loads((proof / 'baseline/reports.json').read_text())
          sealed = {(r['bundle'], r['file']): r['sha256'] for r in before['reports']}
          artifacts = json.loads((proof / 'producer/artifacts.json').read_text())
          bundles = ('org.eclipse.draw2d.tests', 'org.eclipse.gef.tests', 'org.eclipse.zest.tests')
          native_required = {
              ('org.eclipse.draw2d.test.NativeSparseDamageSwtTest', 'exactManagerPostsSparseOrLegacyNativeInvalidation'),
              ('org.eclipse.draw2d.test.NativeDamageRegionsTest', 'seededEnvelopePolicyMatchesIndependentLongArithmetic'),
              ('org.eclipse.draw2d.test.NativeDamageRegionsTest', 'overlapAndNearnessFallBackToOriginalEnvelope'),
              ('org.eclipse.draw2d.test.NativeDamageRegionsTest', 'signedBoundaryRectanglesNeverOverflowTheAreaPolicy'),
              ('org.eclipse.draw2d.test.NativeDamageRegionsTest', 'sparseRectanglesPreserveIndividualCoordinates'),
              ('org.eclipse.draw2d.test.NativeDamageRegionsTest', 'malformedOverflowAndExcessiveRegionsRefuseSplitting'),
          }
          native_classes = {cls for cls, _ in native_required}
          native_seen = {'baseline': Counter(), 'candidate': Counter()}
          def cases(data):
              root = ET.fromstring(data)
              return Counter((c.get('classname'), c.get('name'), tuple((d.tag, d.get('type'), d.get('message'), d.text or '')
                             for d in c if d.tag in ('error', 'failure', 'skipped'))) for c in root.iter('testcase'))
          summaries, seen = [], set()
          for bundle in bundles:
              dirs = {'baseline': proof / 'baseline/reports' / bundle,
                      'candidate': Path('gef', bundle, 'target/surefire-reports')}
              files = {lane: {p.relative_to(directory).as_posix(): p for p in directory.rglob('TEST-*.xml')} for lane, directory in dirs.items()}
              assert files['baseline'] and files['baseline'].keys() == files['candidate'].keys(), bundle
              for name, original in files['baseline'].items():
                  old, new = original.read_bytes(), files['candidate'][name].read_bytes()
                  assert hashlib.sha256(old).hexdigest() == sealed[(bundle, name)], 'Original XML changed'
                  assert cases(old) == cases(new), 'Testcase identities, multiplicities or outcomes changed: ' + name
                  for lane, data in (('baseline', old), ('candidate', new)):
                      for case in ET.fromstring(data).iter('testcase'):
                          if case.get('classname') in native_classes:
                              key = (case.get('classname'), case.get('name'))
                              assert all(case.find(k) is None for k in ('error', 'failure', 'skipped')), key
                              native_seen[lane][key] += 1
              counts = verifier.junit_report(dirs['candidate'], seen)
              assert counts['tests'] > counts['skipped'] and not counts['errors'] and not counts['failures'], counts
              summaries.append({'bundle': bundle, **counts})
          for observed in native_seen.values():
              assert observed == Counter({key: 1 for key in native_required}), 'Required native identities did not each pass exactly once'
          origins = []
          for lane in ('baseline', 'candidate'):
              records = json.loads((proof / lane / 'origins.json').read_text())
              assert records and {b for r in records for b in r['bundles']} == set(bundles)
              for record in records:
                  assert record['booter_sha256'] == artifacts[lane]['booter']['jar_sha256']
                  assert record['reporter_sha256'] == artifacts[lane]['booter']['reporter_sha256']
                  log = proof / lane / record['log']
                  assert hashlib.sha256(log.read_bytes()).hexdigest() == record['log_sha256'], 'Class-load log changed'
              origins.extend(records)
          result = {'source_sha': os.environ['GEF_PROOF_SHA'], 'target': '2024-09', 'java': 21, 'platform': 'GTK/Xvfb',
                    'baseline_rejection': before['expected_rejection'], 'candidate': summaries, 'runtime_origins': origins,
                    'native_opt_in': True, 'required_native_methods': [list(key) for key in sorted(native_required)],
                    'disposition': 'SCOPED_REPORT_HANDOFF_PASS', 'release_disposition': 'HOLD',
                    'remaining': ['existing platform assumptions', 'remaining native platform matrix', 'pixels', 'resources', 'performance']}
          (proof / 'report-handoff.json').write_text(json.dumps(result, indent=2) + '\n')
          print(json.dumps(result, indent=2))
          PY
      - name: Retain original reports, producer logs and runtime source identities
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: surefire356-tycho-gtk-original-report-handoff
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/surefire356-tycho-handoff/**
            ${{ github.workspace }}/gef/**/target/surefire-reports/**
