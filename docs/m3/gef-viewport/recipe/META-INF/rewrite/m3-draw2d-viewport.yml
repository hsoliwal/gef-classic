type: specs.openrewrite.org/v1beta/recipe
name: com.synexia.openrewrite.viewport.Draw2dViewportLayer
displayName: Layer transparency hit test hook
description: Layer.containsPoint asks the index which child contains the point.
recipeList:
  - com.synexia.openrewrite.viewport.M3InsertStatements:
      declaringClasses: [org.eclipse.draw2d.Layer]
      methodName: containsPoint
      parameterCount: 2
      anchor: "y = pt.y;"
      position: AFTER
      statements: "\t\torg.eclipse.draw2d.internal.m3.M3FigureChildren m3 = m3ChildIndex();\n\t\tif (m3 != null) {\n\t\t\treturn m3.containsPoint(x, y);\n\t\t}"
---
type: specs.openrewrite.org/v1beta/recipe
name: com.synexia.openrewrite.viewport.Draw2dViewportLayouts
displayName: XY layout hooks
description: XYLayout lays out only the changed children; constraint changes mark the child.
recipeList:
  - com.synexia.openrewrite.viewport.M3InsertStatements:
      declaringClasses: [org.eclipse.draw2d.XYLayout]
      methodName: layout
      parameterCount: 1
      position: METHOD_START
      statements: "\t\torg.eclipse.draw2d.internal.m3.M3FigureChildren m3 = parent instanceof Figure f ? f.m3ChildIndex() : null;\n\t\tif (m3 != null && m3.layout().layout(this)) {\n\t\t\treturn;\n\t\t}"
  - com.synexia.openrewrite.viewport.M3InsertStatements:
      declaringClasses: [org.eclipse.draw2d.AbstractConstraintLayout]
      methodName: setConstraint
      parameterCount: 2
      position: METHOD_END
      statements: "\t\tif (figure.getParent() instanceof Figure f && f.m3Children != null) {\n\t\t\tf.m3Children.layout().constraintChanged(figure);\n\t\t}"
---
